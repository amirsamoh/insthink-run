<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <script>try{var t=localStorage.getItem('irc_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;if(t==='dark')document.querySelector('meta[name=theme-color]').content='#070D1F'}catch(e){}</script>
  <title>ค้นหา · INSTHINK RUN CLUB</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20.22">
</head>
<body>
  <header class="site-head" data-nav></header>

  <main class="wrap">
    <section class="hero" style="padding-bottom:6px">
      <div class="hero-stripes"></div>
      <span class="eyebrow"><span>RUNNER LOOKUP</span></span>
      <h1 style="font-size:clamp(46px,11vw,100px)">Find <span class="n">your</span><br><span class="o">BIB.</span></h1>
    </section>

    <form class="search-bar mt" id="searchForm">
      <input class="input" id="q" placeholder="ชื่อ, ชื่อเล่น หรือเลข เช่น R012" autocomplete="off" maxlength="60" enterkeyhint="search">
      <button class="btn btn-primary" id="searchBtn" type="submit">ค้นหา</button>
    </form>
    <p class="hint">เพื่อความเป็นส่วนตัว ระบบแสดงนามสกุลเพียงตัวอักษรแรก · เปิดรายละเอียดต้องยืนยันด้วยเบอร์โทร 4 ตัวท้าย</p>

    <div class="results" id="results"></div>
  </main>

  <footer class="site-foot"><img src="img/logo.png" alt="INSTHINK RUN CLUB"></footer>

  <script src="js/config.js?v=20.22"></script>
  <script src="js/api.js?v=20.22"></script>
  <script src="js/common.js?v=20.22"></script>
  <script>
    /* หน้าค้นหา — action "search" คืนข้อมูลแบบจำกัด */
    (function () {
      const { $, esc, toast, busy, pkg, payPill, checkinLabel } = window.U;

      async function run(q) {
        const btn = $('#searchBtn');
        busy(btn, true, '…');
        try {
          const { results } = await API.call('search', { q });
          history.replaceState(null, '', '?q=' + encodeURIComponent(q));
          $('#results').innerHTML = results.length
            ? results.map((r) => {
                const p = pkg(r.package);
                return `<a class="result" href="profile.html?bib=${encodeURIComponent(r.bib)}">
                  <span class="bib-tag ${p.runner ? '' : 'm'}">${esc(r.bib)}</span>
                  <span class="who"><b>${esc(r.name)}${r.nickname ? ' (' + esc(r.nickname) + ')' : ''}</b>
                    <span>${esc(p.label)} · ${r.paymentStatus === 'PAID' ? esc(checkinLabel(r)) : ''}</span></span>
                  ${payPill(r.paymentStatus)}</a>`;
              }).join('')
            : '<p class="muted center mt">ไม่พบผลลัพธ์ — ลองพิมพ์ชื่อจริงหรือเลขอีกครั้ง</p>';
        } catch (e) {
          toast(e.message, 'err');
        } finally {
          busy(btn, false);
        }
      }

      $('#searchForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const q = $('#q').value.trim();
        if (q.length < 2) return toast('พิมพ์อย่างน้อย 2 ตัวอักษร', 'err');
        run(q);
      });

      const q0 = new URLSearchParams(location.search).get('q');
      if (q0) { $('#q').value = q0; run(q0); }
    })();
  </script>
</body>
</html>
